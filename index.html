<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Soft Robot Wing Simulator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="container">
        <header>
            <h1>Soft Robot Wing / Fin Simulator</h1>
            <p>Sensor and controller demonstration</p>
        </header>

        <section class="simulation">
            <canvas id="simulationCanvas" width="900" height="420"></canvas>

            <div class="graph-panel">
                <canvas id="graphCanvas" width="900" height="260"></canvas>
                <div class="legend" aria-label="Graph legend">
                    <span class="legend-target">Target angle</span>
                    <span class="legend-true">True angle</span>
                    <span class="legend-measured">Measured angle</span>
                </div>
            </div>

            <div class="controls">
                <fieldset class="mode-panel">
                    <legend>Pressure control</legend>
                    <label><input type="radio" name="controlMode" value="manual" checked> Manual</label>
                    <label><input type="radio" name="controlMode" value="auto"> Auto PID</label>
                </fieldset>

                <div class="angle-display">
                    <label for="pressureSlider">Input pressure</label>
                    <span id="pressureValue">0 kPa</span>
                </div>
                <input type="range" id="pressureSlider" min="0" max="100" value="0">

                <div class="angle-display">
                    <label for="targetSlider">Target angle</label>
                    <span id="targetValue">0°</span>
                </div>
                <input type="range" id="targetSlider" min="0" max="90" value="0">

                <div class="angle-display">
                    <label for="noiseSlider">Sensor noise</label>
                    <span id="noiseValue">2°</span>
                </div>
                <input type="range" id="noiseSlider" min="0" max="10" step="0.5" value="2">

                <div class="pid-panel">
                    <div class="angle-display">
                        <label for="kpSlider">Kp</label>
                        <span id="kpValue">1.2</span>
                    </div>
                    <input type="range" id="kpSlider" min="0" max="5" step="0.1" value="1.2">

                    <div class="angle-display">
                        <label for="kiSlider">Ki</label>
                        <span id="kiValue">0.2</span>
                    </div>
                    <input type="range" id="kiSlider" min="0" max="2" step="0.05" value="0.2">

                    <div class="angle-display">
                        <label for="kdSlider">Kd</label>
                        <span id="kdValue">0.15</span>
                    </div>
                    <input type="range" id="kdSlider" min="0" max="3" step="0.05" value="0.15">
                </div>

                <fieldset class="mode-panel">
                    <legend>Flapping mode</legend>
                    <label><input type="checkbox" id="flappingToggle"> Enable sine-wave target</label>
                    <div class="angle-display">
                        <label for="frequencySlider">Frequency</label>
                        <span id="frequencyValue">0.5 Hz</span>
                    </div>
                    <input type="range" id="frequencySlider" min="0.1" max="2" step="0.1" value="0.5">
                    <div class="angle-display">
                        <label for="amplitudeSlider">Amplitude</label>
                        <span id="amplitudeValue">30°</span>
                    </div>
                    <input type="range" id="amplitudeSlider" min="5" max="45" step="1" value="30">
                </fieldset>

                <div class="angle-display">
                    <label>True angle</label>
                    <span id="angleValue">0°</span>
                </div>
                <div class="angle-display">
                    <label>Measured angle</label>
                    <span id="measuredValue">0°</span>
                </div>

                <button id="disturbanceButton" class="secondary-button" type="button">Add disturbance</button>
                <button id="resetButton" type="button">Reset</button>
            </div>
        </section>

        <footer>
            This is a simplified educational model, not real physical soft-robot dynamics.
        </footer>
    </main>

    <script src="script.js"></script>
</body>
</html>
